# 生产叠加配置（服务器端用）：
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-build
#
# 服务器全程不下载任何依赖——构建产物与镜像本身都由 ops/deploy.sh 从本机推送：
#   - backend：跑交叉编译好的静态二进制，生产镜像不含 Go 工具链
#     （proxy.golang.org 在部分地区不可达，服务器拉 Go 依赖必失败）
#   - frontend：跑 Nitro 的 .output（自带运行时依赖），生产镜像不装 pnpm
#   - 镜像：本机 buildx 构建 linux/amd64 后 `docker save` 推送，服务器连
#     Docker Hub 同样不可靠。故服务器端一律带 `--no-build`：镜像缺失就报错，
#     不许它自己联网构建
#
# `image` 必须显式写死且带 -prod 后缀：省略时镜像名由目录名推导，换个部署路径
# 就对不上；不加后缀则本机构建的 amd64 镜像会盖掉开发用的同名 arm64 镜像。
#
# volumes 用 `!override` 替换开发用的依赖与构建缓存卷——Compose 对列表默认是追加
# 合并，不覆盖的话生产容器会挂着一堆用不到的空卷。需要 Compose >= 2.24。
# 注意：`!reset` 是清空（会连 uploads 卷一起丢），必须用 `!override`。
services:
  backend:
    image: mms-backend-prod
    build:
      dockerfile: Dockerfile.prod
    command: ./server
    volumes: !override
      - ./backend:/app
      # 商户上传资产（店铺 logo）：必须保留，与代码分离持久化
      - mms-uploads:/app/uploads

  frontend:
    image: mms-frontend-prod
    build:
      dockerfile: Dockerfile.prod
    command: node .output/server/index.mjs
    volumes: !override
      - ./frontend:/app
