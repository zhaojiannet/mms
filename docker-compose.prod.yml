# 生产叠加配置（服务器端用），覆盖开发命令：
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# 覆盖点：
#   - backend：跑 ops/deploy.sh 推送的交叉编译二进制，服务器不联网拉依赖、不编译
#   - frontend：跑构建产物而非 dev server；.output 由 ops/deploy.sh 从本机推送，
#     经 ./frontend 的 bind mount 对容器可见
services:
  backend:
    command: ./server

  frontend:
    command: node .output/server/index.mjs
