# gitleaks 配置：扫描 git 历史 + 工作区，禁止泄露密钥
# https://github.com/gitleaks/gitleaks
#
# 本地手动扫描（配置自动读取 /repo/.gitleaks.toml）：
#   docker run --rm -v $(pwd):/repo ghcr.io/gitleaks/gitleaks:latest git /repo
#
# CI 集成在 .github/workflows/gitleaks.yml

title = "MMS Gitleaks Config"

[extend]
useDefault = true

[allowlist]
description = "项目级例外（确认安全的字符串）"
paths = [
    '''\.env\.example$''',   # 模板，无真值
    '''docs/.*\.md$''',      # 文档示例
]

regexes = [
    # bootstrap 占位密码（首次运行后会强制改）
    '''change_me_on_first_login''',
    '''change_me_in_production''',
    '''change_me_to_a_long_random_string''',
    # 随机密码生成用的字符集（刻意去掉易混的 0O1lI），非密钥。
    # generic-api-key 因变量名含 password 且熵高而误报
    '''abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789''',
]
